name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Debug wpeview API real
        run: |
          find ~/.gradle -name "wpeview-*.aar" 2>/dev/null
          AAR=$(find ~/.gradle -name "wpeview-*.aar" 2>/dev/null | head -n 1)
          echo "AAR=$AAR"
          unzip -o -q "$AAR" classes.jar -d /tmp/wpedbg
          javap -classpath /tmp/wpedbg/classes.jar org.wpewebkit.wpeview.WPEView | head -n 40

      - name: Build APK (Gradle)
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.14.3
          arguments: assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: navegador-wpe
          path: app/build/outputs/apk/**/*.apk
