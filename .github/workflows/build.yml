name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Build APK (Gradle)
        continue-on-error: true
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.14.3
          arguments: :app:compileDebugKotlin

      - name: Debug wpeview API real
        if: always()
        run: |
          echo "=== todos los wpeview en cache ==="
          find "$HOME/.gradle" -path "*wpewebkit*" -name "*.aar" -o -path "*wpewebkit*" -name "*.jar" 2>/dev/null | head -n 20
          for A in $(find "$HOME/.gradle" -path "*wpewebkit*" \( -name "*.aar" -o -name "*.jar" \) 2>/dev/null); do
            echo "--- $A ($(stat -c%s "$A"))"
            rm -rf /tmp/wpedbg && mkdir -p /tmp/wpedbg
            unzip -o -q "$A" classes.jar -d /tmp/wpedbg 2>/dev/null || cp "$A" /tmp/wpedbg/classes.jar
            javap -classpath /tmp/wpedbg/classes.jar org.wpewebkit.wpeview.WPEView 2>&1 | grep -E "WPEView\(|loadUrl|setWPE" | head -n 12
          done

      - name: Build APK (Gradle full)
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.14.3
          arguments: assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: navegador-wpe
          path: app/build/outputs/apk/**/*.apk
